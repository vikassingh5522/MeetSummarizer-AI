services:
  backend:
    build:
      context: ./Backend
      dockerfile: dockerfile
    expose:
      - "5000"
    env_file:
      - ./Backend/.env
    environment:
      PORT: "5000"
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: dockerfile
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  backend-data: